<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Castle Clash — Card Battler</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="game-shell">
  <canvas id="battlefield" width="1280" height="720"></canvas>

  <!-- Top HUD -->
  <div id="top-hud">
    <div class="castle-stat left">
      <span class="label">Your Castle</span>
      <div class="bar"><div id="player-castle-bar" class="fill player"></div></div>
      <span id="player-castle-hp" class="hp">2000 / 2000</span>
    </div>

    <div id="center-hud">
      <button id="pause-btn" class="hud-btn" title="Pause / Resume">II</button>
      <div id="match-timer">3:00</div>
      <button id="speed-btn" class="hud-btn" title="Toggle game speed">x1</button>
    </div>

    <div class="castle-stat right">
      <span class="label">Enemy Castle</span>
      <div class="bar"><div id="enemy-castle-bar" class="fill enemy"></div></div>
      <span id="enemy-castle-hp" class="hp">2000 / 2000</span>
    </div>
  </div>

  <!-- Bottom HUD: mana + hand -->
  <div id="bottom-hud">
    <div id="mana-block">
      <div class="mana-label">MANA <span id="mana-text">0 / 10</span></div>
      <div id="mana-crystals">
        <!-- 10 crystal pips, generated by JS for cleanliness -->
      </div>
    </div>
    <div id="hand"></div>
  </div>

  <!-- Title screen -->
  <div id="title-screen">
    <div class="title-card">
      <div class="title-banner">
        <h1>CASTLE CLASH</h1>
        <p class="subtitle">Real-Time Card Battler</p>
      </div>
      <div class="title-tip">
        Drag a card into the highlighted zone to deploy. <br/>
        Spells can be cast anywhere on the field.
      </div>
      <button id="play-btn" class="primary-btn">Play</button>
    </div>
  </div>

  <!-- Pause overlay -->
  <div id="pause-overlay" class="hidden">
    <div class="overlay-card">
      <h1>Paused</h1>
      <button id="resume-btn" class="primary-btn">Resume</button>
      <button id="quit-btn" class="secondary-btn">Main Menu</button>
    </div>
  </div>

  <!-- Endgame overlay -->
  <div id="endgame" class="hidden">
    <div class="endgame-card">
      <h1 id="endgame-title">Victory</h1>
      <p id="endgame-sub">You crushed the enemy castle.</p>
      <button id="restart-btn" class="primary-btn">Play Again</button>
      <button id="end-menu-btn" class="secondary-btn">Main Menu</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="art.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
